spring.application.name=workout-backend
server.port=8080

# Supabase Postgres — set these in env or application-local.properties
# spring.datasource.url=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
# spring.datasource.username=postgres
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Supabase Auth JWT — set issuer to your project URL
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<project-ref>.supabase.co/auth/v1
