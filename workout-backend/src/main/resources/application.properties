spring.application.name=workout-backend
server.port=8080

# Use application-local.properties for DB credentials (gitignored).
# Activate with: --spring.profiles.active=local
# Or in IntelliJ Run Config → Active profiles: local
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Supabase Auth JWT — set issuer to your project URL
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<project-ref>.supabase.co/auth/v1
